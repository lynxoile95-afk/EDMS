name: edms

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edms}:${POSTGRES_PASSWORD:-edms}@postgres:5432/${POSTGRES_DB:-edms}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    S3_ENDPOINT: http://minio:9000
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edms}
      POSTGRES_DB: ${POSTGRES_DB:-edms}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edms} -d ${POSTGRES_DB:-edms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbucket:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-edms} &&
      mc version enable local/${S3_BUCKET:-edms} &&
      exit 0
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *backend-env
    command: >
      /bin/sh -c "alembic upgrade head &&
      python -m app.bootstrap &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *backend-env
    command: celery -A app.workers.celery_app.celery_app worker -l info -Q ingest,extract,transmittal,notify --concurrency=4
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      - api

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *backend-env
    command: celery -A app.workers.celery_app.celery_app beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend

  # Optional: local VLM server (GPU). Start with:
  #   docker compose --profile vlm up -d vlm
  vlm:
    image: vllm/vllm-openai:latest
    profiles: ["vlm"]
    restart: unless-stopped
    command: >
      --model ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --served-model-name ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --max-model-len 8192 --limit-mm-per-prompt image=2
    volumes:
      - hfcache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
  hfcache:
