upstream edms_api {
    server api:8000;
    keepalive 32;
}

upstream edms_frontend {
    server frontend:80;
    keepalive 16;
}

# Basic abuse protection for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Allow large engineering PDFs (A0 scans can be 100–200 MB)
    client_max_body_size 250m;
    client_body_timeout 300s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/pdf image/svg+xml;
    gzip_min_length 1024;

    # ---------- API ----------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://edms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;   # stream large uploads
        proxy_buffering off;
    }

    # Stricter limit on login / token endpoints
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://edms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- OpenAPI / docs (disable in production) ----------
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://edms_api;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://edms_api;
        access_log off;
    }

    # ---------- Frontend (SPA) ----------
    location / {
        proxy_pass http://edms_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://edms_frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
